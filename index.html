<!DOCTYPE html>
<html lang="en">
<head>

<title>All or Nothing</title>

<style>
  :root {

    --ink: #f7f1e4;

  }
  html[data-theme="crimson"] {

    grid-template-columns: auto 1fr auto;
    gap: 10px;
    align-items: center;

    border-radius: 18px;
    padding: 8px 10px;
  }
  .ava { display: block; filter: drop-shadow(0 4px 0 rgba(0,0,0,.35)); }
  .rank {

    font-size: 1.15rem;
    letter-spacing: 0.02em;

  .xplabel { color: var(--muted); font-size: 0.72rem; margin-top: 3px; }

    width: 100%;

    gap: 8px;
    align-items: center;
    text-align: left;
    padding: 8px 10px;
    border-radius: 18px;
    border: 2px solid var(--line);
    background: linear-gradient(180deg, #3a2460, #241433);
    box-shadow: 0 4px 0 #120814;
    color: var(--ink);

    border-color: var(--accent);
    background: linear-gradient(180deg, #6d1b2c, #2a0c14);
  }
  .node.hot {
    border-color: var(--gold);
    box-shadow: 0 0 0 3px rgba(240, 193, 74, 0.35), 0 4px 0 #120814;
    animation: pulse 1.4s ease-in-out infinite;
  }
  .node:disabled { opacity: 0.55; filter: grayscale(0.35); }
  .medal {
    width: 46px; height: 46px; border-radius: 50%;
    display: grid; place-items: center;
    background: radial-gradient(circle at 40% 35%, #ffe7a3, #c9842a 55%, #6a3a10);
    color: #2a1c08;
    font-family: var(--serif);
    font-weight: 900;
    font-size: 1.2rem;
    border: 2px solid #fff3cc;
  }
  .node.boss .medal { background: radial-gradient(circle at 40% 35%, #ffd0c8, #e23d3d 60%, #5a1018); color: white; }
  .node b { display: block; font-size: 1rem; }
  .node em { display: block; font-style: normal; color: var(--muted); font-size: 0.75rem; }
  .stars { display: flex; gap: 2px; }
  .star { opacity: 0.28; width: 16px; height: 16px; }
  .star svg { width: 100%; height: 100%; display: block; }
  .star.on { opacity: 1; }
  .heart svg { width: 100%; height: 100%; display: block; }
  .bounty, .rowbtn, .primary, .ghost, .choice, .shopitem {
    border-radius: 16px;
    min-height: 56px;
  }
  .bounty {
    width: 100%;
    text-align: left;
    padding: 12px 14px;
    border: 2px dashed var(--gold);
    background: rgba(240, 193, 74, 0.08);
    margin: 6px 0 10px;
  }
  .bounty:disabled { opacity: 0.6; }
  .bounty b { display: block; }
  .bounty span { color: var(--muted); font-size: 0.82rem; }
  .footer-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .ghost {
    background: transparent;
    border: 2px solid var(--line);
    color: var(--ink);
    font-weight: 700;
    padding: 10px;
  }
  .primary {
    width: 100%;
    border: 0;
    background: linear-gradient(180deg, #ffe08a, var(--gold));
    color: var(--gold-ink);
    font-weight: 900;
    box-shadow: 0 4px 0 #8a6418;
    padding: 12px 14px;
  }
  .primary:active, .ghost:active, .choice:active { transform: translateY(2px); }
  .primary:disabled { opacity: 0.45; box-shadow: none; }
  .playtop {
    display: flex;
    align-items: center;
    justify-content: space-between;

    margin-bottom: 8px;

  .combo { display: flex; align-items: center; gap: 6px; font-weight: 900; }

  .flames { display: flex; gap: 3px; align-items: flex-end; height: 26px; }

    border-radius: 50% 50% 45% 45%;
    background: #3a3048;
  }
  .flames i.on {
    height: 22px;
    background: radial-gradient(circle at 50% 75%, #fff6d0, #ffb703 42%, #e23d3d 74%);

    animation: flicker .28s infinite;
  }
  .timenum {

    min-width: 2ch;

  .timenum.low { color: #ff8d7a; }
  .timer { margin: 4px 0 8px; height: 12px; }
  .timer > span { display: block; height: 100%; width: 100%; background: linear-gradient(90deg, var(--accent), var(--gold)); }
  .timer.low > span { background: #ff5a3c; }
  .hearts { display: flex; gap: 4px; }
  .heart { width: 22px; height: 20px; opacity: 0.25; }
  .heart.full { opacity: 1; filter: drop-shadow(0 0 4px #e23d3d); }
  .boss-wrap {
    position: relative;
    width: 116px;
    height: 116px;
    margin: 0 auto 6px;
  }
  .boss-wrap svg { width: 116px; height: 116px; display: block; }
  .slash {
    position: absolute; left: 8%; right: 8%; top: 48%; height: 7px;
    background: linear-gradient(90deg, transparent, #fff, var(--gold), transparent);
    opacity: 0; border-radius: 4px;
  }
  .boss-wrap.hit svg { animation: smack .45s ease; }
  .boss-wrap.hit .slash { animation: slash .45s ease-out; }
  .boss-wrap.hurt svg { animation: hurt .4s ease; }
  .hp { margin: 4px 0 8px; height: 16px; border-color: #5a1820; }
  .hp > span { display: block; height: 100%; background: linear-gradient(90deg, #7a1020, #ff5a3c); transition: width .35s ease; }
  .bossname { margin: 0 0 2px; text-align: center; font-family: var(--serif); font-size: 1.45rem; color: #ffe1a8; line-height: 1.1; }
  .hplabel { display: flex; justify-content: flex-end; font-size: 0.75rem; letter-spacing: 0.08em; text-transform: uppercase; color: #ffb4a8; font-weight: 800; }
  .scroll {
    background: linear-gradient(180deg, #f8e7c4, #e7d3a1);
    color: var(--sand-ink);
    border-radius: 16px;
    padding: 12px 14px;
    box-shadow: inset 0 0 0 2px rgba(90, 60, 20, 0.18);
  }
  .kicker { margin: 0; letter-spacing: 0.12em; text-transform: uppercase; font-size: 0.68rem; font-weight: 800; color: #8a5a20; }
  .scroll h3, .wordbig {
    margin: 2px 0;
    font-family: var(--serif);
    font-size: clamp(1.55rem, 7vw, 2.15rem);
    line-height: 1.05;
  }
  .scroll p { margin: 6px 0 0; font-family: var(--serif); font-size: 1.12rem; line-height: 1.35; }
  .choices { display: flex; flex-direction: column; gap: 8px; margin-top: 10px; }
  .choice {
    width: 100%;
    text-align: left;
    padding: 12px 12px;
    border: 2px solid rgba(240, 193, 74, 0.35);
    background: linear-gradient(180deg, #432a62, #2a1840);
    font-weight: 700;
    line-height: 1.3;
  }
  .choice .letter {
    display: inline-grid; place-items: center;
    width: 1.6rem; height: 1.6rem; margin-right: 8px;
    border-radius: 50%; background: var(--gold); color: var(--gold-ink);
    font-family: var(--serif); font-weight: 900;
  }
  .choice.is-right { background: #1d3a22; border-color: var(--good); color: var(--good); }
  .choice.is-wrong { background: #4a1c22; border-color: #ff8d7a; color: var(--bad); }
  .choice:disabled { opacity: 1; }
  .feedback { margin-top: 10px; border-radius: 14px; padding: 12px; line-height: 1.4; }
  .feedback.good { background: #16301c; border: 2px solid var(--good); }
  .feedback.bad { background: #3a1618; border: 2px solid #ff8d7a; }
  .feedback .fk { margin: 0 0 4px; font-size: 0.72rem; letter-spacing: 0.12em; text-transform: uppercase; font-weight: 900; }
  .feedback.good .fk { color: var(--good); }
  .feedback.bad .fk { color: var(--bad); }
  .feedback p { margin: 0; }
  .actions { margin-top: 10px; display: flex; flex-direction: column; gap: 8px; }
  .blankbox {
    width: 100%; margin-top: 10px;
    background: #140c18; color: var(--ink);
    border: 2px solid var(--gold); border-radius: 14px;
    min-height: 56px; padding: 12px 14px; font-size: 1.15rem; font-family: var(--serif);
  }
  .gap { border-bottom: 3px solid #8a5a20; color: #8a3a12; font-weight: 900; padding: 0 4px; }
  .scorebig {
    font-family: var(--serif);
    font-size: 3.2rem;
    margin: 0;
    line-height: 0.9;
    color: var(--gold);
    text-align: center;
  }
  .result-stars { display: flex; justify-content: center; gap: 8px; margin: 8px 0; }
  .result-stars .star { width: 42px; height: 42px; opacity: 0.25; }
  .result-stars .star.on { opacity: 1; animation: pop .45s both; }
  .result-stars .star.on:nth-child(2) { animation-delay: .12s; }
  .result-stars .star.on:nth-child(3) { animation-delay: .24s; }
  .banner {
    text-align: center;
    background: linear-gradient(180deg, #ffe08a, var(--gold));
    color: var(--gold-ink);
    font-weight: 900;
    border-radius: 12px;
    padding: 8px;
    margin-bottom: 8px;
  }
  .shopgrid { display: flex; flex-direction: column; gap: 8px; }
  .shopitem {
    width: 100%;
    text-align: left;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px 10px;
    border: 2px solid var(--line);
    background: var(--card);
  }
  .shopitem.on { border-color: var(--good); }
  .swatch { width: 28px; height: 28px; border-radius: 50%; border: 2px solid white; }
  .linkish { background: none; border: 0; color: var(--muted); text-decoration: underline; min-height: 44px; }
  .search, .seg button { min-height: 48px; }
  .search {
    width: 100%; border-radius: 14px; border: 2px solid var(--line);
    background: #140c18; padding: 10px 12px; margin: 8px 0;
  }
  .seg { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
  .seg button { border-radius: 12px; border: 2px solid var(--line); background: transparent; }
  .seg button[aria-pressed="true"] { background: var(--gold); color: var(--gold-ink); font-weight: 800; }
  .wordbtn, .root-head { text-align: left; }
  .wordbtn {
    width: 100%; margin-top: 8px; min-height: 54px;
    border-radius: 14px; border: 2px solid var(--line); background: #1a1028; padding: 10px 12px;
  }
  .detail { padding: 8px 4px 12px; color: var(--muted); font-family: var(--serif); line-height: 1.4; }
  .flip { perspective: 1000px; }
  .flip-inner { display: grid; transition: transform .45s; transform-style: preserve-3d; min-height: 280px; }
  .flip.is-flipped .flip-inner { transform: rotateY(180deg); }
  .face { grid-area: 1 / 1; backface-visibility: hidden; border-radius: 18px; padding: 16px; background: var(--card); border: 2px solid var(--line); }
  .face.back { transform: rotateY(180deg); }
  .flip:not(.is-flipped) .face.back { pointer-events: none; }
  .flip.is-flipped .face.front { pointer-events: none; }
  .float {
    position: fixed; left: 50%; top: 38%;
    transform: translateX(-50%);
    font-family: var(--serif); font-weight: 900; font-size: 2rem;
    color: var(--gold); text-shadow: 0 3px 0 #3a140c;
    pointer-events: none; z-index: 20;
    animation: floatUp .8s ease-out forwards;
  }
  .bit {
    position: fixed; width: 8px; height: 8px; z-index: 19; pointer-events: none;
    animation: burst .7s ease-out forwards;
  }
  #app.shake { animation: shake .4s linear; }
  .toast {
    position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%);
    background: #1a1028; color: var(--ink); border: 2px solid var(--gold);
    border-radius: 999px; padding: 8px 14px; z-index: 30; font-size: 0.85rem;
  }
  @keyframes pulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(240, 193, 74, 0.45), 0 4px 0 #120814; }
    50% { box-shadow: 0 0 0 8px rgba(240, 193, 74, 0), 0 4px 0 #120814; }
  }
  @keyframes flicker {
    50% { transform: scaleY(1.12) translateY(-1px); }
  }
  @keyframes pop {
    0% { transform: scale(.6); opacity: 0; }
    60% { transform: scale(1.12); }
    100% { transform: scale(1); opacity: 1; }
  }
  @keyframes floatUp {
    to { transform: translateX(-50%) translateY(-70px); opacity: 0; }
  }
  @keyframes burst {
    to { transform: translate(var(--dx), var(--dy)) rotate(160deg); opacity: 0; }
  }
  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    20% { transform: translateX(-7px); }
    40% { transform: translateX(7px); }
    60% { transform: translateX(-4px); }
    80% { transform: translateX(4px); }
  }
  @keyframes smack {
    0% { transform: scale(1) rotate(0); }
    35% { transform: scale(.9) rotate(-8deg); filter: brightness(1.8); }
    100% { transform: scale(1) rotate(0); }
  }
  @keyframes hurt {
    0%, 100% { transform: translateX(0); }
    25% { transform: translateX(-6px); filter: brightness(1.4); }
    75% { transform: translateX(6px); }
  }
  @keyframes slash {
    0% { opacity: 0; transform: rotate(-18deg) scaleX(.2); }
    30% { opacity: 1; transform: rotate(-18deg) scaleX(1); }
    100% { opacity: 0; transform: rotate(-18deg) scaleX(1.05); }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
</style>
</head>

  { id: "VANUS", lesson: 4, name: "VANUS", lang: "Latin", meaning: "empty", parts: "VANUS", familiar: ["avoid", "evacuate", "vain", "vacation", "vacuum", "void"], challenge: ["devoid", "vacate"], note: "VANUS and VACUUS both mean empty. Vanity and vaunt come from VANUS." },

const WORDS = [
  { word: "pandemonium", lesson: 3, pos: "n.", defs: ["Uproar."], examples: ["Pandemonium threatens to break out after Julius Caesar is assassinated on the ides of March, but in Shakespeare's play Brutus calms the murderous senators."], forms: [], root: "PAN" },

function load() {

    base.xp = data.xp || 0;
    base.coins = data.coins || 0;
    base.hat = data.hat || "laurel";

function esc(s) {
  return String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
  }[c]));
}
function rich(text) {
  return String(text).split(/(\*[^*]+\*)/g).map((part) => {
    if (part.startsWith("*") && part.endsWith("*") && part.length > 2) return "<em>" + esc(part.slice(1, -1)) + "</em>";
    return esc(part);
  }).join("");
}
function shuffle(list) {
  const a = list.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    const t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}
function take(list, n) { return shuffle(list).slice(0, n); }
function rootById(id) { return ROOTS.find((r) => r.id === id); }
function wordByName(name) { return WORDS.find((w) => w.word === name); }
function wordsFor(lesson) { return WORDS.filter((w) => !lesson || w.lesson === lesson); }
function starsOf(id) { return (save.stars && save.stars[id]) || 0; }
function isUnlocked(id) {
  const i = ORDER.indexOf(id);
  if (i <= 0) return true;
  return starsOf(ORDER[i - 1]) >= 1;
}
function currentId() {
  return ORDER.find((id) => isUnlocked(id) && !starsOf(id)) || "";
}
function rankInfo(xp) {
  let i = 0;
  RANKS.forEach((r, idx) => { if (xp >= r.xp) i = idx; });
  const cur = RANKS[i];
  const next = RANKS[i + 1];
  const pct = next ? (xp - cur.xp) / (next.xp - cur.xp) : 1;
  return { name: cur.name, next: next ? next.name : "", pct: Math.max(0, Math.min(1, pct)), xp: xp };
}
function rootLabel(id) {
  const r = rootById(id);
  return r.name + " means " + r.meaning;
}
function rootExplain(word, id) {
  const r = rootById(id);
  let text = word + " comes from " + r.name + ", " + r.lang + " for \"" + r.meaning + ".\"";
  if (id === "VANUS" || id === "VACUUS") text += " VANUS and VACUUS both mean empty, but they are different roots.";
  if (id === "PAN" || id === "OMNIS") text += " PAN is Greek and OMNIS is Latin. Both mean all.";
  if (id === "HOLOS" || id === "TOTUS") text += " HOLOS is Greek and TOTUS is Latin. Both mean whole.";
  return text;
}
function choiceList(answer, wrong) {
  const uniq = [];
  [answer].concat(wrong).forEach((t) => { if (t && !uniq.includes(t)) uniq.push(t); });
  return shuffle(uniq).map((text) => ({ text: text, correct: text === answer }));
}
function distractorWords(answer, pool) {
  const names = pool.map((w) => w.word).filter((w) => w !== answer);
  const out = [];
  (CONFUSABLES[answer] || []).forEach((name) => {
    if (name !== answer && !out.includes(name)) out.push(name);
  });
  shuffle(names).forEach((name) => { if (out.length < 3 && !out.includes(name)) out.push(name); });
  shuffle(WORDS.map((w) => w.word)).forEach((name) => {
    if (out.length < 3 && name !== answer && !out.includes(name)) out.push(name);
  });
  return out.slice(0, 3);
}
function makeDef(w, def, suffix) {
  const pool = WORDS.filter((o) => o.lesson === w.lesson);
  return {
    uid: "def:" + w.word + (suffix || ""),
    type: "mc", qtype: "def", lesson: w.lesson,
    heading: "Which word fits this meaning?",
    word: "", prompt: def,
    choices: choiceList(w.word, distractorWords(w.word, pool)),
    answer: w.word,
    explain: w.word + " means " + String(def).replace(/\.$/, "") + ". " + rootExplain(w.word, w.root)
  };
}
function makeRoot(w) {
  const correct = rootLabel(w.root);
  const ids = [w.root];
  if (TWIN[w.root]) ids.push(TWIN[w.root]);
  shuffle(ROOTS.map((r) => r.id).filter((id) => !ids.includes(id))).forEach((id) => { if (ids.length < 4) ids.push(id); });
  const labels = ids.map(rootLabel);
  return {
    uid: "root:" + w.word, type: "mc", qtype: "root", lesson: w.lesson,
    heading: "Which root does this word come from?",
    word: w.word, prompt: "",
    choices: choiceList(correct, labels.filter((l) => l !== correct)),
    answer: correct,
    explain: rootExplain(w.word, w.root)
  };
}
function makePhrase(spec, kind) {
  const base = wordByName(spec.base);
  return {
    uid: kind + ":" + spec.word, type: "mc", qtype: kind, lesson: base.lesson,
    heading: kind === "syn" ? "Which is closest in meaning?" : "Which is most nearly the opposite?",
    word: spec.word, prompt: "",

    answer: spec.answer, explain: spec.explain

}
function makeBlank(item) {
  return {
    uid: item.uid, type: "blank", qtype: "blank", lesson: item.lesson,
    heading: "Fill in the missing word.",
    sentence: item.sentence, accept: item.accept, show: item.show,

}
function makeUsage(item) {
  const bad = item.options.find((o) => o.bad);
  return {
    uid: item.uid, type: "usage", qtype: "usage", lesson: item.lesson,
    heading: "Which sentence uses the word wrong?",
    word: item.word,
    options: shuffle(item.options.map((o) => ({ text: o.text, bad: o.bad }))),
    answer: bad.text,
    explain: item.wrongWhy + " " + item.explain
  };
}
function lessonSpecs(list, lesson) {
  return list.filter((spec) => wordByName(spec.base).lesson === lesson);
}
function buildLevelQueue(meta) {
  const lesson = meta.lesson;
  if (meta.type === "def") return take(wordsFor(lesson).map((w) => makeDef(w, w.defs[0])), 5);
  if (meta.type === "root") return take(wordsFor(lesson).map(makeRoot), 5);
  if (meta.type === "blank") return take(BLANKS.filter((b) => b.lesson === lesson).map(makeBlank), 5);
  if (meta.type === "usage") return take(USAGE.filter((u) => u.lesson === lesson).map(makeUsage), 5);
  return [];
}
function buildBossQueue(lesson) {
  if (!lesson) {
    return shuffle([].concat(
      take(WORDS, 4).map((w) => makeDef(w, w.defs[0])),
      take(WORDS, 2).map(makeRoot),
      take(SYNONYMS, 2).map((s) => makePhrase(s, "syn")),
      take(ANTONYMS, 2).map((s) => makePhrase(s, "ant"))
    ));
  }
  return shuffle([].concat(
    take(wordsFor(lesson), 3).map((w) => makeDef(w, w.defs[0])),
    take(wordsFor(lesson), 2).map(makeRoot),
    take(lessonSpecs(SYNONYMS, lesson), 2).map((s) => makePhrase(s, "syn")),
    take(lessonSpecs(ANTONYMS, lesson), 1).map((s) => makePhrase(s, "ant"))
  ));
}
function buildLightningDeck() {
  return shuffle([].concat(
    WORDS.map((w) => makeDef(w, w.defs[0])),
    SYNONYMS.map((s) => makePhrase(s, "syn")),
    WORDS.map(makeRoot)
  ));
}
function normalizeAnswer(raw) {
  return String(raw || "").trim().replace(/\s+/g, " ").replace(/[.?!]+$/g, "");
}
function gradeBlank(item, raw) {
  const cleaned = normalizeAnswer(raw);
  if (!cleaned) return { empty: true };
  const folded = cleaned.toLowerCase().replace(/^the\s+/, "");
  if (item.near && item.near[folded]) return { ok: false, text: item.near[folded] + " " + item.explain };
  if (!item.accept.includes(folded)) return { ok: false, text: "The answer is " + item.show + ". " + item.explain };
  if (item.capital) {
    const core = cleaned.replace(/^the\s+/i, "");
    if (!core || core[0] !== "H") return { ok: false, text: "Almost. Capitalize the historical event: Holocaust. " + item.explain };
  }
  return { ok: true, text: item.explain };
}
function filledSentence(item) {
  return String(item.sentence || "").replace("_____", item.show);
}
function timeFor(q) {
  if (!q) return 0;
  if (q.type === "blank") return 24;
  if (q.type === "usage") return 20;
  if (q.qtype === "root") return 14;
  return 16;
}

function freshRun(partial) {

function startLevel(id) {
  if (id !== "rematch" && !isUnlocked(id)) { toast("Win the previous trial first."); return; }
  clearAll();
  const meta = LEVELS[id];
  let queue = [];
  let kind = "level";
  let hp = 0;
  let coinMult = 1;
  if (id === "rematch") {
    if (!save.rematch.length) { toast("No rivals waiting yet."); return; }
    queue = take(save.rematch, 6).map((q) => JSON.parse(JSON.stringify(q)));
    kind = "rematch";
    coinMult = 2;
  } else if (meta.kind === "boss") {
    queue = buildBossQueue(meta.lesson);
    kind = "boss";
    hp = meta.hp;
  } else {
    queue = buildLevelQueue(meta);
  }
  if (!queue.length) { toast("Nothing is queued for that trial."); return; }
  freshRun({
    kind: kind, levelId: id, name: id === "rematch" ? "Rematch" : meta.name,
    queue: queue, hp: hp, maxHp: hp, coinMult: coinMult
  });

  ui.feedback = null;
  ui.blank = "";

function noteResult(q, ok) {
  if (!q) return;
  if (ok) save.rematch = save.rematch.filter((r) => r.uid !== q.uid);
  else if (!save.rematch.some((r) => r.uid === q.uid)) {
    save.rematch.push(JSON.parse(JSON.stringify(q)));
    if (save.rematch.length > 30) save.rematch = save.rematch.slice(-30);
  }
}
function multOf(combo) { return Math.max(1, Math.min(4, combo)); }
function resolve(ok, explain) {
  if (ui.answered || !run || run.over) return;
  const q = current();
  ui.answered = true;
  clearQuestionTimer();
  run.total += 1;
  run.justHit = false;
  run.justHurt = false;
  noteResult(q, ok);
  let pts = 0;
  let mult = 1;
  if (ok) {
    run.combo += 1;
    run.bestCombo = Math.max(run.bestCombo, run.combo);
    save.bestCombo = Math.max(save.bestCombo || 0, run.combo);
    mult = multOf(run.combo);
    const speed = ui.timeLeft || 0;
    pts = Math.round((100 + speed * 8) * mult);
    if (run.kind === "lightning") pts = (80 + (speed > 4 ? 40 : 0)) * mult;
    run.score += pts;
    run.correct += 1;
    const purse = (4 + Math.ceil(speed / 4)) * mult * (run.coinMult || 0);
    if (run.kind !== "drill") run.coinsEarned += purse;
    run.xpEarned += 10 + mult * 3;
    if (run.kind === "boss") {
      run.hp = Math.max(0, run.hp - 1);
      run.justHit = true;
    }
  } else {
    run.combo = 0;
    if (run.kind === "boss") {
      run.hearts -= 1;
      run.justHurt = true;
    }
  }
  let extra = "";
  if (ok && run.kind !== "drill") extra = " +" + pts + " points. Combo x" + mult + ".";
  if (!ok && run.combo === 0 && run.kind !== "drill") extra = " Combo lost.";
  if (run.kind === "boss" && ok) extra += " The boss loses a chunk of HP.";
  if (run.kind === "boss" && !ok) extra += " A heart breaks. " + Math.max(0, run.hearts) + " left.";
  ui.feedback = { ok: ok, text: explain + extra, pts: pts, mult: mult };
  persist();
  render();
  juice(ok, ok ? ((run.kind === "boss" ? "HIT +" : "+") + pts) : "");
  if (run.kind === "lightning") {
    ui.flashT = setTimeout(() => {
      if (!run || run.over) return;
      if (Date.now() >= ui.lightEnds) finish(true);
      else goNext(true);
    }, 420);
  }
}
function onTimeout() {
  if (ui.answered || !run) return;
  const q = current();
  if (!q) return;
  if (q.type === "blank") resolve(false, "Time is up. The answer is " + q.show + ". " + q.explain);
  else if (q.type === "usage") resolve(false, "Time is up. The wrong sentence was: " + q.answer + " " + q.explain);
  else resolve(false, "Time is up. The answer is " + q.answer + ". " + q.explain);
}
function goNext(fromFlash) {
  if (!run || run.over) return;
  if (!fromFlash && run.kind === "lightning") return;
  if (run.kind === "boss") {
    if (run.hp <= 0) return finish(true);
    if (run.hearts <= 0) return finish(false);
  }
  if (run.index + 1 >= run.queue.length) {
    if (run.kind === "lightning") {
      run.queue = run.queue.concat(buildLightningDeck());
    } else if (run.kind === "boss" && run.hp > 0) {
      return finish(false);
    } else {
      return finish(true);
    }
  }
  run.index += 1;
  ui.answered = false;
  ui.feedback = null;
  ui.blank = "";
  ui.picked = null;
  ui.timeLeft = 0;
  ui.timerArmed = false;
  run.justHit = false;
  run.justHurt = false;
  render();
}
function finish(win) {
  if (!run || run.over) return;
  run.over = true;
  run.win = !!win;
  clearAll();
  const before = rankInfo(save.xp).name;
  let xpGain = run.xpEarned;
  let coinGain = 0;
  if (run.kind === "drill") xpGain = Math.round(run.xpEarned / 2);
  if (run.kind === "level" || run.kind === "boss") {
    if (win) {
      const acc = run.correct / Math.max(1, run.total);
      let stars = 1;
      if (acc >= 0.9) stars = 3;
      else if (acc >= 0.6) stars = 2;
      const prev = starsOf(run.levelId);
      save.stars[run.levelId] = Math.max(prev, stars);
      run.stars = stars;
      coinGain = run.coinsEarned + 10 * stars;
    } else run.stars = 0;
  } else if (run.kind === "rematch" || run.kind === "lightning") {
    coinGain = run.coinsEarned;
    if (run.kind === "lightning" && run.score > (save.lightningBest || 0)) {
      run.record = true;
      save.lightningBest = run.score;
    }
  }
  save.xp += xpGain;
  save.coins += coinGain;
  save.totalCorrect = (save.totalCorrect || 0) + run.correct;
  run.xpGain = xpGain;
  run.coinGain = coinGain;
  run.rankName = rankInfo(save.xp).name;
  run.rankedUp = run.rankName !== before;
  persist();
  ui.screen = "result";
  render();
  if (win) juice(true, "");
}

    const wrap = document.getElementById("timer");
    if (!bar) { clearQuestionTimer(); return; }
    bar.style.width = (ui.timeLeft / ui.timeMax * 100) + "%";
    if (num) num.textContent = String(Math.ceil(ui.timeLeft));
    if (wrap) wrap.classList.toggle("low", ui.timeLeft <= 5);
    if (num) num.classList.toggle("low", ui.timeLeft <= 5);
    if (ui.timeLeft <= 0) onTimeout();
  }, 100);
}
function armLightning() {
  if (ui.lightArmed || !run || run.kind !== "lightning" || run.over) return;
  ui.lightArmed = true;
  if (!ui.lightEnds) ui.lightEnds = Date.now() + 60000;

    const num = document.getElementById("timenum");

  }, 100);
}
function juice(ok, label) {
  const app = document.getElementById("app");
  const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  if (!reduce && app && !ok) {
    app.classList.remove("shake");

    for (let i = 0; i < 16; i++) {
      const bit = document.createElement("i");
      bit.className = "bit";
      const colors = ["#f0c14a", "#e23d3d", "#fff6d0", "#7ecbff", "#b6f0a0"];
      bit.style.background = colors[i % colors.length];
      bit.style.left = (40 + Math.random() * 20) + "%";
      bit.style.top = "42%";
      bit.style.setProperty("--dx", (Math.random() * 180 - 90) + "px");
      bit.style.setProperty("--dy", (Math.random() * 160 - 120) + "px");
      document.body.appendChild(bit);
      setTimeout(() => bit.remove(), 750);
    }
  }

function buyOrEquip(listName, ownedName, field, id) {
  const list = listName === "hat" ? HATS : THEMES;
  const item = list.find((entry) => entry.id === id);
  if (!item) return;
  const owned = save[ownedName];
  if (!owned.includes(id)) {
    if (save.coins < item.price) { toast("Not enough coins yet."); return; }
    save.coins -= item.price;
    owned.push(id);

  else if (act === "drill") startDrill();
  else if (act === "slesson") { ui.studyLesson = btn.dataset.lesson; render(); }
  else if (act === "open") { ui.openWord = ui.openWord === btn.dataset.word ? null : btn.dataset.word; render(); }
  else if (act === "know") { markWord(btn.dataset.word, "known"); render(); }
  else if (act === "learn") { markWord(btn.dataset.word, "practice"); render(); }
  else if (act === "flip") { ui.flipped = !ui.flipped; render(); }
  else if (act === "card-know" || act === "card-learn") {
    const w = ui.flash[ui.flashIndex];
    markWord(w, act === "card-know" ? "known" : "practice");
    ui.flipped = false;
    ui.flashIndex += 1;
    if (ui.flashIndex >= ui.flash.length) ui.screen = "study";
    render();
  }
  else if (act === "hat") buyOrEquip("hat", "ownedHats", "hat", btn.dataset.id);
  else if (act === "theme") buyOrEquip("theme", "ownedThemes", "theme", btn.dataset.id);
  else if (act === "pick") {
    if (ui.answered) return;
    const q = current();
    const i = Number(btn.dataset.i);
    ui.picked = i;
    const choice = q.choices[i];
    resolve(!!choice.correct, choice.correct ? q.explain : "The answer is " + q.answer + ". " + q.explain);
  }
  else if (act === "usage") {
    if (ui.answered) return;
    const q = current();
    const i = Number(btn.dataset.i);
    ui.picked = i;
    const opt = q.options[i];
    resolve(!!opt.bad, q.explain);
  }
  else if (act === "check") {
    const q = current();
    const graded = gradeBlank(q, ui.blank);
    if (graded.empty) return;
    resolve(graded.ok, graded.text + " " + filledSentence(q).replace(/\*/g, ""));
  }
  else if (act === "next") goNext(false);
  else if (act === "reset") {
    if (!confirm("Clear arena progress on this device?")) return;
    save = defaultSave();
    persist();
    localStorage.removeItem(KEY);
    ui.screen = "map";
    render();
  }
});
document.body.addEventListener("input", (event) => {
  if (event.target.id === "blank") {
    ui.blank = event.target.value;
    const check = document.getElementById("check");
    if (check) check.disabled = !ui.blank.trim();
  } else if (event.target.id === "search") {
    ui.query = event.target.value;
    const pos = event.target.selectionStart;
    render();
    const again = document.getElementById("search");
    if (again) { again.focus(); again.setSelectionRange(pos, pos); }
  }
});
document.body.addEventListener("keydown", (event) => {
  if (event.target && event.target.id === "blank" && event.key === "Enter") {
    event.preventDefault();
    const q = current();
    if (!q) return;
    const graded = gradeBlank(q, ui.blank);
    if (!graded.empty) resolve(graded.ok, graded.text + " " + filledSentence(q).replace(/\*/g, ""));
    return;
  }
  if (event.target && (event.target.id === "search" || event.target.id === "blank")) return;
  if (ui.screen === "play" && !ui.answered && /^[1-4]$/.test(event.key)) {
    const q = current();
    const index = Number(event.key) - 1;
    if (q && q.type === "mc" && q.choices[index]) {
      ui.picked = index;
      const choice = q.choices[index];
      resolve(!!choice.correct, choice.correct ? q.explain : "The answer is " + q.answer + ". " + q.explain);
    }
    if (q && q.type === "usage" && q.options[index]) {
      ui.picked = index;
      resolve(!!q.options[index].bad, q.explain);
    }
  }
});
document.documentElement.dataset.theme = save.theme || "marble";
window.__game = {
  get save() { return save; },
  get run() { return run; },
  get ui() { return ui; },
  get q() { return current(); },
  gradeBlank: gradeBlank,
  WORDS: WORDS,
  isUnlocked: isUnlocked
};
render();
</script>
</body>
</html>
